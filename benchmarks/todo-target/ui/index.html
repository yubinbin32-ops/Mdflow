<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdflow Todo target</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; background: #101218; color: #f4f6fb; }
      main { max-width: 44rem; margin: 4rem auto; padding: 0 1.5rem; }
      form { display: flex; gap: .75rem; }
      input, button { border: 1px solid #586174; border-radius: .6rem; padding: .7rem .85rem; font: inherit; }
      input { flex: 1; background: #1a1e29; color: inherit; }
      button { background: #a6e3a1; color: #11151b; cursor: pointer; }
      ul { list-style: none; padding: 0; display: grid; gap: .65rem; }
      li { display: flex; justify-content: space-between; gap: 1rem; border: 1px solid #303747; border-radius: .7rem; padding: .8rem 1rem; }
      [aria-live] { min-height: 1.5rem; color: #f9c2c2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo</h1>
      <p>Small target app used for the mdflow context and recovery benchmark.</p>
      <form id="todo-form">
        <label for="todo-text" hidden>Todo text</label>
        <input id="todo-text" name="text" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <p id="error" aria-live="polite"></p>
      <ul id="todo-list" aria-live="polite"></ul>
      <script type="module">
        const form = document.querySelector("#todo-form");
        const input = document.querySelector("#todo-text");
        const list = document.querySelector("#todo-list");
        const error = document.querySelector("#error");
        const render = (todos) => { list.replaceChildren(...todos.map((todo) => { const item = document.createElement("li"); item.textContent = `${todo.completed ? "✓" : "○"} ${todo.text}`; return item; })); };
        const refresh = async () => { const response = await fetch("/api/todos"); render(await response.json()); };
        form.addEventListener("submit", async (event) => { event.preventDefault(); error.textContent = ""; const text = input.value; input.disabled = true; const response = await fetch("/api/todos", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) }); input.disabled = false; if (!response.ok) { error.textContent = (await response.json()).error; return; } input.value = ""; await refresh(); });
        refresh();
      </script>
    </main>
  </body>
</html>
